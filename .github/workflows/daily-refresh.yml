name: Update jobs and publish website

on:
  schedule:
    - cron: '0 1 * * *' # 09:00 Asia/Shanghai and Asia/Singapore
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: southbound-daily
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify merge and parser logic
        run: python -m unittest discover -s tests -v
      - name: Fetch public employer listings
        id: collect
        continue-on-error: true
        run: python collector.py
      - name: Save data history
        run: |
          git config user.name 'southbound-bot'
          git config user.email 'southbound-bot@users.noreply.github.com'
          git add data/jobs.json public/snapshot.js public/details public/translations
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh official job listings'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish snapshot
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report incomplete sync
        if: steps.collect.outcome == 'failure'
        run: |
          echo 'A listing source or full JD refresh failed. Previous usable data was retained; see source status or the job detail notice.'
          exit 1
