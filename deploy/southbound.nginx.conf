limit_req_zone $binary_remote_addr zone=southbound_api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=southbound_translate:10m rate=2r/m;
server {
    listen 80;
    server_name southbound.chillicurry.uk;
    root /srv/southbound/app/public;
    index index.html;
    client_max_body_size 1k;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme-southbound; }
    location = /api/translate {
        limit_req zone=southbound_translate burst=2 nodelay;
        include /etc/nginx/snippets/southbound-proxy.conf;
    }
    location ^~ /api/ {
        limit_req zone=southbound_api burst=30 nodelay;
        include /etc/nginx/snippets/southbound-proxy.conf;
    }
    location = /snapshot.js { root /var/lib/southbound/public; add_header Cache-Control no-cache; }
    location /details/ { root /var/lib/southbound/public; try_files $uri =404; }
    location /translations/ { root /var/lib/southbound/public; try_files $uri =404; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; add_header Cache-Control no-cache; }
}
